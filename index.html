<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Main</title>
		<link rel="stylesheet" href="css/style.min.css" />
	</head>

	<body>
		<!-- Header -->
		<header>
	<section class="section header">
		<div class="container header__container">
			<h2 class="title visually--hidden header__title">Header</h2>
		</div>
	</section>
</header>

		<!-- Header End -->

		<main>
			<!-- English -->
			<section class="section english">
	<div class="container english__container">
		<h2 class="title visually--hidden engligh__title">English</h2>

		<!-- Links -->
		<div class="english__links">
			<a href="#" class="english__link">Link</a>
		</div>

		<!-- English inputs wrapper -->
		<div class="english__inputs-wrapper">
			<div class="input english__input" id="word-en">English</div>
			<div class="input english__input" id="word-ru" data-visible="false">Russian</div>
		</div>

		<!-- Button -->
		<button type="button" class="button english__button" id="next-btn">Next</button>

		<!-- Counter -->
		<div class="english__counter-wrapper">
			<span class="english__counter"></span>
		</div>
	</div>
</section>

		</main>

		<!-- Footer -->
		<footer>
	<section class="section footer">
		<div class="container footer__container">
			<h2 class="title visually--hidden footer__title">Footer</h2>
		</div>
	</section>
</footer>

		<!-- Footer End -->
		<script src="js/main.min.js"></script>
	</body>
</html>
